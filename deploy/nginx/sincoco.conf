# vhost de SINCOCO en la EC2.
#
# nginx NO publica la aplicación directamente: solo acepta las peticiones que
# llegan a través de CloudFront, que añade el header X-Origin-Verify con un
# secreto generado en el despliegue (el marcador __ORIGIN_VERIFY__ lo reemplaza
# deploy/instalar-backend.sh). Así el puerto 80 sigue abierto para que
# CloudFront alcance el origen, pero el backend no queda expuesto a Internet.
#
# El secreto tiene 48 caracteres: hay que subir el tamaño de bucket del hash
# del map o nginx se niega a arrancar ("could not build map_hash").
map_hash_bucket_size 128;
map $http_x_origin_verify $origen_permitido {
  default 0;
  "__ORIGIN_VERIFY__" 1;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 5m;

  if ($origen_permitido = 0) {
    return 403;
  }

  # El frontend vive en S3/CloudFront; aquí solo se atiende el API.
  location /api/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /salud {
    add_header Content-Type text/plain;
    return 200 "sincoco-ok\n";
  }

  location / {
    return 404;
  }
}
